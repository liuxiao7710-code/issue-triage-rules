[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-triage-rules"
version = "0.1.0"
description = "Apply deterministic TOML rules to GitHub issue payloads and return labels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Source Maintainers" }]
keywords = ["github", "issues", "triage", "labels", "cli", "toml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Bug Tracking",
]

[project.scripts]
issue-triage-rules = "issue_triage_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
